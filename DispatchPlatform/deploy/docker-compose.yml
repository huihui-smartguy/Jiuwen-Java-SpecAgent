services:
  testwise:
    build:
      context: ..
      dockerfile: Dockerfile
    image: testwise:latest
    ports:
      - "8080:8080"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:3000}
    volumes:
      - ${RUNTIME_CONFIG_PATH:-../public/config/runtime.json}:/usr/share/nginx/html/config/runtime.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
