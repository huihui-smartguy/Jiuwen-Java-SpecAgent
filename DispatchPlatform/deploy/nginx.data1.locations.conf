# Include this file inside the existing public server block on the deployment host.
# It keeps TestWise isolated under /testwise/ and proxies only its API calls.

location = /testwise {
  return 302 /testwise/;
}

location = /testwise/healthz {
  default_type text/plain;
  return 200 "ok\n";
}

location = /testwise/config/runtime.json {
  alias /data1/testwise/current/config/runtime.json;
  add_header Cache-Control "no-store";
}

location ^~ /testwise/api/ {
  proxy_pass http://127.0.0.1:3000/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /testwise/ {
  alias /data1/testwise/current/;
  index index.html;
  try_files $uri $uri/ /testwise/index.html;
}
