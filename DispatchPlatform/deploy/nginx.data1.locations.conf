# Include this file inside the existing public server block on the deployment host.
# It keeps TestWise isolated under /testwise/ and proxies only its API calls.

location = /testwise {
  return 302 /testwise/;
}

location = /testwise/healthz {
  default_type text/plain;
  return 200 "ok\n";
}

location = /testwise/config/runtime.json {
  alias /data1/testwise/current/config/runtime.json;
  add_header Cache-Control "no-store";
}

location = /testwise/ {
  alias /data1/testwise/current/;
  index index.html;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /testwise/index.html {
  alias /data1/testwise/current/index.html;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /testwise/api/reports {
  proxy_pass http://127.0.0.1:3001/api/reports;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /testwise/api/reports/ {
  proxy_pass http://127.0.0.1:3001/api/reports/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /testwise/api/catalog/events {
  proxy_pass http://127.0.0.1:3000/api/catalog/events;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;
  add_header X-Accel-Buffering "no";
}

location = /testwise/api/quality/overview/events {
  proxy_pass http://127.0.0.1:3000/api/quality/overview/events;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;
  add_header X-Accel-Buffering "no";
}

location ^~ /testwise/api/ {
  proxy_pass http://127.0.0.1:3000/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /testwise/ {
  alias /data1/testwise/current/;
  index index.html;
  try_files $uri $uri/ /testwise/index.html;
}
